<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryGuard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>StoryGuard</h1>
    <p>AI가 고치고, 알고리즘이 엔딩까지 확인합니다</p>
  </div>
  <div class="game-title" id="gameTitle">게임을 불러오는 중</div>
  <div class="status">
    <span class="badge" id="modeBadge">모드 확인 중</span>
    <span class="health" id="healthText"></span>
    <span class="health" id="storeText"></span>
  </div>
</header>

<main class="layout">
  <!-- 왼쪽: 게임 창 -->
  <section class="window" aria-label="게임 플레이">
    <div class="window-bar"><span id="playTitle">게임 플레이</span><button class="win-x" id="playReset" title="처음부터 다시">↺</button></div>
    <canvas id="scene" width="320" height="168" aria-hidden="true"></canvas>
    <div class="play-body">
      <div class="area-name" id="areaName"></div>
      <div class="npcs" id="npcs"></div>
      <div class="inventory"><span class="inv-label">가방</span><span id="items"></span></div>
      <div class="actions" id="actions"></div>
      <ol class="log" id="playLog"></ol>
    </div>
    <div class="play-source" id="playSource">원본 게임으로 플레이 중</div>
  </section>

  <!-- 가운데: 스토리 지도 -->
  <section class="map-panel" aria-label="스토리 진행 지도">
    <div class="map-head">
      <h2>스토리 진행 지도</h2>
      <div class="legend">
        <span><i class="dot ok"></i>갈 수 있음</span>
        <span><i class="dot blocked"></i>막힌 곳</span>
        <span><i class="dot missing"></i>얻을 수 없음</span>
        <span><i class="dot unreachable"></i>도달 못함</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="map-scroll"><svg id="map" role="img" aria-label="퀘스트, 아이템, 지역의 선행 관계"></svg></div>
  </section>

  <!-- 오른쪽: 수정 요청과 결과 -->
  <section class="side" aria-label="수정 요청">
    <form id="reqForm" class="req">
      <label for="reqText">게임을 어떻게 바꿀까요?</label>
      <textarea id="reqText" rows="3" placeholder="예: 두 번째 퀘스트 보상을 황금 열쇠에서 마법 지팡이로 바꿔 줘"></textarea>
      <div class="presets" id="presets"></div>
      <div class="req-row">
        <label class="toggle"><input type="checkbox" id="autoRetry"> 문제가 있으면 자동으로 다시 고치기</label>
        <button type="submit" class="btn primary" id="reqBtn">수정 요청</button>
      </div>
    </form>
    <div id="result" class="result" aria-live="polite">
      <p class="empty">수정 요청을 보내면, 바뀐 게임이 엔딩까지 갈 수 있는지 여기서 알려 드립니다.</p>
    </div>
    <div class="side-foot">
      <button class="btn ghost" id="resetBtn">원본 게임으로 되돌리기</button>
      <button class="btn ghost" id="saveBtn">수정본 저장</button>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
